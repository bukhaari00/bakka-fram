version: '3.8'

services:
  mysql:
    image: mysql:8.0
    container_name: bakka_farm_mysql
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: rootpassword
      MYSQL_DATABASE: bakka_farm
      MYSQL_USER: bakka_user
      MYSQL_PASSWORD: bakka_password
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql

volumes:
  mysql_data:
